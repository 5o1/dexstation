[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dexstation"
version = "0.1.0"
description = "Dexterous-hand simulation collection workstation and web console"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{name = "5o1"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
web = ["aiohttp>=3.9", "opencv-python>=4.10", "PyYAML>=6", "pillow>=10"]
sim = ["sapien @ https://github.com/5o1/xbox_gamepad_physics/releases/download/v0.4.3/sapien-3.0.3%2Bconcon.physx5.6.1.a3-cp310-cp310-manylinux_2_35_x86_64.whl#sha256=6ca9a10bb81ae834acd811911c4335e6679207f245c2fe444be6bd608512eca1", "xbox-gamepad-physics[build,robotwin,teleop]==0.4.3", "PyYAML>=6", "pillow>=10", "trimesh>=4", "opencv-python>=4.10", "transforms3d>=0.4", "networkx>=3", "scipy>=1.11", "rtree>=1.2"]
mujoco = ["mujoco>=3.3", "xbox-gamepad-physics[build,mujoco]==0.4.3"]
data = ["pyarrow>=18"]

[project.scripts]
dexstation-server = "dexstation.cli.server:main"
dexstation-recover = "dexstation.cli.recover:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dexstation", "dexstation.*"]

[tool.setuptools.package-data]
"dexstation" = ["contracts/schemas/*", "contracts/examples/*"]
"dexstation.render" = ["web/*", "data/*"]
"dexstation.server" = ["web/*", "web/overlay/*", "web/overlay/fonts/*"]
"dexstation.inputs" = ["linkerta_assets/*", "retarget_assets/*"]
"dexstation.examples.ar5_g20" = ["data/*", "data/calibration/*", "data/sources/*", "appearance/*", "motion_assets/*", "motion_assets/vendor/*"]
"dexstation.task_plugins.empty" = ["data/*"]
"dexstation.task_plugins.tabletop_cube_grasp" = ["data/*"]
"dexstation.task_plugins.xbox_gamepad_v3_3" = ["data/*", "data/autopilot/*", "assets/*", "web/*", "web/fonts/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
